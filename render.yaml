# render.yaml
# This configuration file tells Render how to deploy your services.

services:
  # This section defines your frontend static site.
  - type: static
    name: ai-seo-report-generator # You can keep this name or change it
    env: static
    # Tells Render to serve the files from the root directory of your project.
    staticPublishPath: .
    
    # This is the crucial part that fixes the blank page issue.
    headers:
      - path: '/*'
        name: 'Content-Security-Policy'
        # This header allows your site to be embedded in an iframe on any domain (like GoHighLevel).
        # It overrides Render's default security setting that was blocking it.
        value: 'frame-ancestors *'
